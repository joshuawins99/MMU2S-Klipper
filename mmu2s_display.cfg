[menu __main __mmu_menu __mmu_load_to_nozzle]
type: list
name: Load to Nozzle

[menu __main __mmu_menu __mmu_load_to_nozzle __select_slot]
type: input
name: Select Slot: [F{menu.input|int}]
input: {printer["gcode_macro MMU_MENU_VARS"].selected_slot|int}
input_min: 1
input_max: 5
input_step: 1
gcode:
    SET_MMU_STATE SLOT={menu.input|int}

[menu __main __mmu_menu __mmu_load_to_nozzle __select_material]
type: input
name: {% set mats = ["PLA (215C)", "PETG (240C)", "ABS (255C)"] %}Mat: [{mats[menu.input|int]}]
input: {printer["gcode_macro MMU_MENU_VARS"].selected_material_idx|int}
input_min: 0
input_max: 2
input_step: 1
gcode:
    SET_MMU_STATE MAT_IDX={menu.input|int}

[menu __main __mmu_menu __mmu_load_to_nozzle __mmu_load_mat_execute]
type: command
name: > Load
gcode:
    {% set target_slot = printer["gcode_macro MMU_MENU_VARS"].selected_slot|int %}
    {% set mat_idx = printer["gcode_macro MMU_MENU_VARS"].selected_material_idx|int %}
    {% set mats = ["PLA", "PETG", "ABS"] %}
    {% set chosen_mat = mats[mat_idx] %}

    {% if chosen_mat == "PLA" %}
        M109 S215
    {% elif chosen_mat == "PETG" %}
        M109 S240
    {% elif chosen_mat == "ABS" %}
        M109 S255
    {% endif %}
    {menu.exit()}
    MMU_LOAD SLOT={target_slot-1}

[menu __main __mmu_menu __mmu_unload_from_nozzle]
type: list
name: Unload from Nozzle

[menu __main __mmu_menu __mmu_unload_from_nozzle __select_material]
type: input
name: {% set mats = ["PLA (215C)", "PETG (240C)", "ABS (255C)"] %}Mat: [{mats[menu.input|int]}]
input: {printer["gcode_macro MMU_MENU_VARS"].selected_material_idx|int}
input_min: 0
input_max: 2
input_step: 1
gcode:
    SET_MMU_STATE MAT_IDX={menu.input|int}

[menu __main __mmu_menu __mmu_unload_from_nozzle __tip_shaping]
type: input
name: {% set mats = ["Yes", "No"] %}Tip Shape: [{mats[menu.input|int]}]
input: 0
input_min: 0
input_max: 1
input_step: 1
gcode:
    SET_MMU_STATE TIP_SHAPE={1-menu.input|int}

[menu __main __mmu_menu __mmu_unload_from_nozzle __mmu_unload_execute]
type: command
name: > Unload
gcode:
    {% set mat_idx = printer["gcode_macro MMU_MENU_VARS"].selected_material_idx|int %}
    {% set tip_shape = printer["gcode_macro MMU_MENU_VARS"].tip_shape|int %}
    {% set mats = ["PLA", "PETG", "ABS"] %}
    {% set chosen_mat = mats[mat_idx] %}

    {% if chosen_mat == "PLA" %}
        M109 S215
    {% elif chosen_mat == "PETG" %}
        M109 S240
    {% elif chosen_mat == "ABS" %}
        M109 S255
    {% endif %}

    {menu.exit()}
    {% if tip_shape == 1 %}
        MMU_UNLOAD TIP_SHAPE=1
    {% else %}
        MMU_UNLOAD
    {% endif %}

