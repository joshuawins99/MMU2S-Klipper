[gcode_macro MMU_MENU_VARS]
variable_selected_slot: 1
variable_selected_material_idx: 0
variable_tip_shape: 1
gcode:

[gcode_macro SET_MMU_STATE]
gcode:
    {% if 'SLOT' in params %}
        SET_GCODE_VARIABLE MACRO=MMU_MENU_VARS VARIABLE=selected_slot VALUE={params.SLOT|int}
    {% endif %}
    {% if 'MAT_IDX' in params %}
        SET_GCODE_VARIABLE MACRO=MMU_MENU_VARS VARIABLE=selected_material_idx VALUE={params.MAT_IDX|int}
    {% endif %}
    {% if 'TIP_SHAPE' in params %}
        SET_GCODE_VARIABLE MACRO=MMU_MENU_VARS VARIABLE=tip_shape VALUE={params.MAT_IDX|int}
    {% endif %}

[menu __main __mmu_menu]
type: list
name: MMU Control

[menu __main __mmu_menu __mmu_preload]
type: list
name: Preload to MMU

[menu __main __mmu_menu __mmu_preload __mmu_preload_all]
type: command
name: Load all
gcode: 
  MMU_PRELOAD SLOT=0
  MMU_PRELOAD SLOT=1
  MMU_PRELOAD SLOT=2
  MMU_PRELOAD SLOT=3
  MMU_PRELOAD SLOT=4
  {menu.exit()}

[menu __main __mmu_menu __mmu_preload __mmu_preload_0]
type: command
name: Load Filament 1
gcode: 
    MMU_PRELOAD SLOT=0
    {menu.exit()}

[menu __main __mmu_menu __mmu_preload __mmu_preload_1]
type: command
name: Load Filament 2
gcode: MMU_PRELOAD SLOT=1

[menu __main __mmu_menu __mmu_preload __mmu_preload_2]
type: command
name: Load Filament 3
gcode: 
    MMU_PRELOAD SLOT=2
    {menu.exit()}

[menu __main __mmu_menu __mmu_preload __mmu_preload_3]
type: command
name: Load Filament 4
