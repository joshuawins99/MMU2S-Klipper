[display_template _mmu_tool_status]
text:
    {% set tool = printer.save_variables.variables.mmu_loaded_slot | default(-1) | int %}
    {% set tool_changing = printer.save_variables.variables.mmu_changing_slot | default(5) | int %}
    {% set tool_prev = printer.save_variables.variables.mmu_previous_slot | default(5) | int %}
    {% if tool_changing != 5 and tool_prev != 5 %}
      F{tool_prev+1}->{tool_changing+1}
    {% elif tool == -1 or tool == 5 %}
        F?
    {% else %}
        F{tool+1}
    {% endif %}
[display_data __custom_display_layout mmu_tool_status_display]
position: 2, 8
text: { render("_mmu_tool_status") }