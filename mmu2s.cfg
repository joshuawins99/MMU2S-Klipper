[mmu2s]
serial: /dev/ttyUSB0
baud: 115200
timeout: 1.0
load_total_distance: 250 # Used as a timeout for filament to load between the FINDA and Filament Extruder Sensor
load_step: 5 # Used as a granularity amount for gcode commands send to extruder motor while waiting for filament to arrive
load_extra_pull: 5 # Extra amount to pull filament in after filament detected from a load
load_extra_retract: -30 # Amount to retract filament after extra pull. If extra_pull is 0 then this is ignored.
load_slow_feedrate: 0 # Feedrate of the extruder motor to pull filament in. 0 reads MMU register to match it. In mm/s
unload_retract_speed: 20 # Initial extruder retraction speed on an unload from extruder
unload_step: 2 # Used as a granularity amount for gcode commands send to extruder motor while waiting for filament sensor to deactivate
unload_max_retract: 100 # Used as a timeout for filament to unload from extruder
FINDA_poll_rate: 10 # Polling rate of FINDA probe (sec)
mmu_slow_feedrate: 0 # Allows for writing MMU register to change slow_feedrate. 0 means use default
mmu_load_feedrate: 0 # Allows for writing MMU register to change load_feedrate. 0 means use default
mmu_bowden_length: 0 # Allows for writing MMU register to change bowden_length. 0 means use default
mmu_cut_length: 0 # Allows for writing MMU register to change cut_length. 0 means use default
mmu_restart: False # Toggles MMU restarting when Klipper initializes

[gcode_macro _SYNC_EXTRUDER_PANEL]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set current_slot = svv.mmu_loaded_slot | default(5) | int %}
    
    SET_GCODE_VARIABLE MACRO=T0 VARIABLE=active VALUE={1 if current_slot == 0 else 0}
    SET_GCODE_VARIABLE MACRO=T1 VARIABLE=active VALUE={1 if current_slot == 1 else 0}
    SET_GCODE_VARIABLE MACRO=T2 VARIABLE=active VALUE={1 if current_slot == 2 else 0}
    SET_GCODE_VARIABLE MACRO=T3 VARIABLE=active VALUE={1 if current_slot == 3 else 0}
    SET_GCODE_VARIABLE MACRO=T4 VARIABLE=active VALUE={1 if current_slot == 4 else 0}


[delayed_gcode INIT_EXTRUDER_PANEL_SYNC]
initial_duration: 1.5
gcode:
    _SYNC_EXTRUDER_PANEL

[gcode_macro MMU_TIP_SHAPE]
gcode:
    G1 E-15.0000 F6000
    G1 E-24.5000 F5400
    G1 E-7.0000 F2700
    G1 E-3.5000 F1620
    G4 P0
    G1 E20.0000 F1044
    G1 E-20.0000 F1183
    G1 E20.0000 F1322
    G1 E-20.0000 F1462
    G1 E20.0000 F1601
    G1 E-20.0000 F1740
    G1 E-35.0000 F2000
    G4 P0
    G1 E-2.0000 F1800
    G4 P500
    G1 E-2 F3000

[gcode_macro MMU_UNLOAD_SEQUENCE]
gcode:
  SAVE_GCODE_STATE NAME=unload_state
  G91
  {% if params.TEMP is defined or printer.extruder.can_extrude|lower == 'false' %}
    M117 Heating...
    M109 S{params.TEMP|default(220, true)}
  {% endif %}
  G92 E0.0
  G91
  G1 E-45 F5000
  G1 E-15 F1000
  G1 E-20 F1000
  G90
  G92 E0.0
  M400
  RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro T0]
description: MMU Tool 0
variable_active: 0
gcode:
    {% if printer.virtual_sdcard.is_active == True %}
        SET_FILAMENT_SENSOR SENSOR=fsensor ENABLE=0
        MMU_LOAD SLOT=0
        _SYNC_EXTRUDER_PANEL
    {% else %}
        M118 MMU Dashboard Lock: Manual tool changes are disabled!
    {% endif %}

